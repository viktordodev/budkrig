name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: typecheck · lint · test · build · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: build (app + worker)
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: smoke — standalone server serves /healthz
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3000/healthz"; then echo; echo "healthz ok"; exit 0; fi
            sleep 1
          done
          echo "healthz did not respond in time"; exit 1
        env:
          SKIP_ENV_VALIDATION: "1"
          PORT: "3000"
          HOSTNAME: "0.0.0.0"

  docker:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          tags: budkrig:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Full Playwright (Stripe test mode) + Testcontainers integration matrix
  # lands in Milestone 2, alongside the payment loop (ADR-0014).

  deploy:
    name: trigger Coolify deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, docker]
    steps:
      - name: Call Coolify deploy webhook
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK" -H "Authorization: Bearer $TOKEN"
